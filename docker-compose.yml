version: '3.8'

# definicje sieci
networks:
  proxy-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  app-net:
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
  db-net:
    ipam:
      config:
        - subnet: 172.32.0.0/24
          gateway: 172.32.0.1

# nazwane wolumeny
volumes:
  postgres-data:
  redis-data:

# mapowanie sekretow
secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt

configs:
  nginx_config:
    file: ./nginx.conf
  app_config:
    file: ./backend/app.config.json

services:
  nginx:
    image: nginx:alpine
    networks:
      - proxy-net
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    depends_on:
      backend_1:
        condition: service_started
      backend_2:
        condition: service_started

  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # podstawienie wersji aplikacji
    image: backend_app:${APP_VERSION:-latest}
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-3000}
      - POSTGRES_DB=${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    networks:
      - proxy-net
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend_app:${APP_VERSION:-latest}
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      - BACKEND_PORT=3001
      - POSTGRES_DB=${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    networks:
      - proxy-net
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: worker_app:${APP_VERSION:-latest}
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    secrets:
      - db_user
      - db_password
    networks:
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_user
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # serwisy debugowe
  adminer:
    image: adminer:latest
    profiles: ["debug"]
    ports:
      - "8080:8080"
    networks:
      - db-net

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["debug"]
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    networks:
      - db-net

  # serwis migracji
  db-migrator:
    image: alpine
    profiles: ["migrate"]
    restart: "no"
    command: ["echo", "Running migrations..."]
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy